name: Probe (none)
slug: probe_none
version: "0.3.0"
description: Permission variant of Elixir Probe — no Supervisor API access and no Core API access
arch:
  - aarch64
  - amd64
init: false

# Same published image as every other variant; only the permissions below
# differ. That is what makes a variant free to add: no build, no new image.
image: ghcr.io/bbangert/ha-bench-addons/{arch}-elixir-probe

# The permission set under observation.
hassio_api: false
homeassistant_api: false

startup: application
boot: manual

# Distinct host port per variant so several can run at once.
ports:
  4000/tcp: 4001
ports_description:
  4000/tcp: HTTP eval endpoint — arbitrary code execution, token required

options:
  auth_token: ""
schema:
  auth_token: str
